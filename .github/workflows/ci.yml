name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: validate and test
    # RUNNER: with the repository variable CI_RUNNER set, a self-hosted runner with that label;
    # otherwise GitHub's ubuntu-latest. Pull requests from forks and Dependabot always run on GitHub.
    runs-on: >-
      ${{ (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')) &&
      vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      # The version the tests were written against; bump deliberately after reading its release notes.
      CLAUDE_CODE_VERSION: 2.1.296
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: claude --version
      # The plugin directory blocks a parameter named h (JSX compiles to calls of h in .tsx files) and
      # a nested one named on (it shadows register's own `on`, which stays): CHANGELOG 0.5.2. Fail here first.
      - name: No parameters named h or on
        run: "! grep -nE '(^|[^A-Za-z0-9_$])(h|on) =>|\\(h[,)]|, ?(h|on)\\)' hooks/*.ts hooks/*.tsx"
      # The file rules of Anthropic's plugin directory a script can check (size, binaries, lockfiles, launchers).
      - name: Directory file checks
        run: bash .github/scripts/directory-checks.sh
      # Manifest, marketplace, hooks module and state contract; warnings fail the build.
      - run: claude plugin validate --strict .
      # The mod's tests run against the engine with no session, sign-in or network.
      - run: claude plugin test .
