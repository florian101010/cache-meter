<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Cache Meter, a Claude Code Mod – stop wasting tokens: every break kept warm with /keepwarm auto, the cost under every answer, why a cache broke. A re-write after a break costs about $1.20, a keepwarm ping about $0.03.">
