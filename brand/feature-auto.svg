<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-label="Every break: /keepwarm auto – switched on once, it keeps the prompt cache warm through every break of the session, by itself.">
<defs>
<radialGradient id="bg" cx="0.12" cy="0.3" r="1.1"><stop offset="0" stop-color="#2b2540"/><stop offset="0.55" stop-color="#16141f"/><stop offset="1" stop-color="#0c0b12"/></radialGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a6b"/><stop offset="1" stop-color="#d97757"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.045"/></pattern>
</defs>
<rect width="1280" height="240" rx="24" fill="url(#bg)"/>
<rect width="1280" height="240" rx="24" fill="url(#dots)"/>
<circle cx="210" cy="120" r="150" fill="#d97757" opacity="0.05"/>
<text x="40" y="62" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#7f849c">prompt cache</text>
<rect x="40" y="74" width="360" height="14" rx="7" fill="#2a2939"/>
<rect x="40" y="74" width="360" height="14" rx="7" fill="#3ddc84" filter="url(#glow)"><animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0.000;0.180;0.423;0.428;0.652;0.657;0.819;0.824;1.000" values="360;360;62;360;62;360;290;360;360"/><animate attributeName="fill" dur="9s" repeatCount="indefinite" keyTimes="0.000;0.180;0.423;0.428;0.652;0.657;0.819;0.824;1.000" values="#3ddc84;#3ddc84;#f0a050;#3ddc84;#f0a050;#3ddc84;#3ddc84;#3ddc84;#3ddc84"/></rect>
<line x1="102" y1="68" x2="102" y2="94" stroke="#ff8a5c" stroke-width="4" stroke-linecap="round"/>
<line x1="40" y1="168" x2="440" y2="168" stroke="#2a2939" stroke-width="6" stroke-linecap="round"/>
<rect x="132" y="165" width="260" height="6" rx="3" fill="#d97757" fill-opacity="0.18"/>
<circle cx="58" cy="168" r="8" fill="#d97757" opacity="1"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.041;0.051;0.97;1" values="0.15;0.15;1;1;0.15"/></circle>
<circle cx="86" cy="168" r="8" fill="#d97757" opacity="1"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.104;0.114;0.97;1" values="0.15;0.15;1;1;0.15"/></circle>
<circle cx="114" cy="168" r="8" fill="#d97757" opacity="1"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.167;0.177;0.97;1" values="0.15;0.15;1;1;0.15"/></circle>
<circle cx="228" cy="168" r="8" fill="#ff8a5c" opacity="0.35" filter="url(#glow)"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.423;0.433;0.503;1" values="0;0;1;0.35;0.35"/><animate attributeName="r" dur="9s" repeatCount="indefinite" keyTimes="0;0.423;0.483;1" values="6;6;20;8"/></circle>
<text x="228" y="150" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#ff8a5c">ping</text>
<circle cx="330" cy="168" r="8" fill="#ff8a5c" opacity="0.35" filter="url(#glow)"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.652;0.662;0.732;1" values="0;0;1;0.35;0.35"/><animate attributeName="r" dur="9s" repeatCount="indefinite" keyTimes="0;0.652;0.712;1" values="6;6;20;8"/></circle>
<text x="330" y="150" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#ff8a5c">ping</text>
<circle cx="404" cy="168" r="8" fill="#d97757" opacity="1"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.819;0.829;0.97;1" values="0.15;0.15;1;1;0.15"/></circle>
<text x="86" y="198" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#7f849c">you work</text>
<text x="268" y="198" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#7f849c">away · 2h</text>
<text x="404" y="198" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#7f849c">back</text>
<g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.819;0.839;0.97;1" values="0;0;1;1;0"/><rect x="312" y="106" width="128" height="28" rx="14" fill="#3ddc84" fill-opacity="0.14" stroke="#3ddc84" stroke-opacity="0.6"/><text x="376" y="125" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9af2b8">cache warm ✓</text></g>
<line x1="40" y1="156" x2="40" y2="180" stroke="#f5f5f7" stroke-opacity="0.7" stroke-width="2"><animate attributeName="x1" dur="9s" repeatCount="indefinite" keyTimes="0;0.9;1" values="40;440;440"/><animate attributeName="x2" dur="9s" repeatCount="indefinite" keyTimes="0;0.9;1" values="40;440;440"/></line>
<rect x="470" y="40" width="151" height="28" rx="14" fill="#d97757" fill-opacity="0.14" stroke="#d97757" stroke-opacity="0.55"/>
<text x="487" y="59" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1.6" fill="#ff9a6b">EVERY BREAK</text>
<text x="470" y="118" font-family="'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="46" font-weight="700" fill="#f5f5f7" letter-spacing="-0.8">/keepwarm auto</text>
<text x="472" y="160" font-family="'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="23" fill="#cdd6f4">Type it once – every break stays warm, by itself.</text>
<text x="472" y="198" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#7f849c">opt-in · pings only while you are away · 2h break ≈ 2 pings</text>
<rect x="1" y="1" width="1278" height="238" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
</svg>