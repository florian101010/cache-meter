<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-label="Keep it: /keepwarm – one tiny ping keeps the prompt cache alive while you are away.">
<defs>
<radialGradient id="bg" cx="0.12" cy="0.3" r="1.1"><stop offset="0" stop-color="#2b2540"/><stop offset="0.55" stop-color="#16141f"/><stop offset="1" stop-color="#0c0b12"/></radialGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a6b"/><stop offset="1" stop-color="#d97757"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.045"/></pattern>
</defs>
<rect width="1280" height="240" rx="24" fill="url(#bg)"/>
<rect width="1280" height="240" rx="24" fill="url(#dots)"/>
<circle cx="210" cy="120" r="150" fill="#d97757" opacity="0.05"/>

<circle cx="210" cy="120" r="74" fill="none" stroke="#2a2939" stroke-width="16" stroke-linecap="round" stroke-dasharray="361.6 465.0" transform="rotate(130 210 120)"/>
<circle cx="210" cy="120" r="74" fill="none" stroke="#3ddc84" stroke-width="16" stroke-linecap="round" stroke-dasharray="348.7 465.0" transform="rotate(130 210 120)" filter="url(#glow)"><animate attributeName="stroke-dasharray" dur="9s" repeatCount="indefinite" keyTimes="0;0.62;0.70;0.84;1" values="348.7 465.0;67.2 465.0;67.2 465.0;348.7 465.0;348.7 465.0"/><animate attributeName="stroke" dur="9s" repeatCount="indefinite" keyTimes="0;0.40;0.50;0.76;0.84;1" values="#3ddc84;#3ddc84;#f0a050;#f0a050;#3ddc84;#3ddc84"/></circle>
<line x1="154.0" y1="122.3" x2="118.1" y2="123.9" stroke="#ff8a5c" stroke-width="6" stroke-linecap="round"/>
<circle cx="136.1" cy="123.1" r="8" fill="#ff8a5c" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.64;0.68;0.80;1" values="0;0;0.95;0;0"/><animate attributeName="r" dur="9s" repeatCount="indefinite" keyTimes="0;0.64;0.80;1" values="8;8;30;8"/></circle>
<text x="210" y="132" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="34" font-weight="700" fill="#f5f5f7">↻</text>
<g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.68;0.72;0.94;1" values="0;0;1;1;0"/>
<rect x="266" y="28" width="170" height="30" rx="15" fill="#3ddc84" fill-opacity="0.14" stroke="#3ddc84" stroke-opacity="0.6"/>
<text x="351" y="48" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#9af2b8">ping ok · 148k read</text>
</g>
<rect x="470" y="40" width="108" height="28" rx="14" fill="#d97757" fill-opacity="0.14" stroke="#d97757" stroke-opacity="0.55"/>
<text x="487" y="59" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1.6" fill="#ff9a6b">KEEP IT</text>
<text x="470" y="118" font-family="'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="46" font-weight="700" fill="#f5f5f7" letter-spacing="-0.8">/keepwarm</text>
<text x="472" y="160" font-family="'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif" font-size="23" fill="#cdd6f4">One tiny ping keeps the cache alive while you are away.</text>
<text x="472" y="198" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#7f849c">≈ 1/20 of a re-write · heartbeat in the band · stops on a miss</text>
<rect x="1" y="1" width="1278" height="238" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
</svg>